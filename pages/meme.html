<div id="memePage">
  <h1>Trang Meme</h1>
  <p>Kho meme</p>
<!-- 🎲 RANDOM MEME TODAY -->
<div id="dailyMemeControl" style="margin-bottom:16px; text-align:center;">
  <button id="randomDailyBtn">🎲 Random Meme Hôm Nay</button>
</div>

  <div id="memeGrid"></div>

  <!-- 🔄 LOADING -->

    text-align:center;
    color:#333333;
    font-size:18px;
    margin:20px 0;
  ">

  </div>

    <div class="popup-footer">
      <button onclick="closeDailyMemePopup()">Đóng</button>
    </div>
  </div>
</div>
